<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>ちょすたぶ</title>
        <link rel="stylesheet" href="/css/option.css">
        <script src="/js/options.js" defer></script>
    </head>
    <body>
    <header>
        <h1>ちょすたぶ - おぷしょん</h1>
    </header>
    <main>
        <div class="card">
        <h2>===🕑時計/📅日付===</h2>
            <label>
                <input type="checkbox" id="showClock">
                時計を表示
            </label>

            <label>
                <input type="checkbox" id="showSeconds">
                秒を表示
            </label>

            <label>
                <input type="checkbox" id="showDate">
                日付を表示
            </label>
        </div>


        <div class="card">
        <h2>===🖼️背景===</h2>
        <h3>背景を変更</h3>

        <input type="file" id="backgroundFile" accept="image/*">

        <p>
            ※過去5枚をランダム表示<br>
            背景をデフォルトに戻してから再び選択することで1枚のみ表示可能
        </p>
        </div>

        <div class="card">
        <h2>===ユーティリティ===</h2>

        <label for="searchEngine">検索エンジン</label>

        <select id="searchEngine">
            <option value="google">Google</option>
            <option value="bing">Bing</option>
            <option value="duckduckgo">DuckDuckGo</option>
            <option value="yahoo">Yahoo! JAPAN</option>
        </select>

        <label>
            <input type="checkbox" id="showMemo">
            メモ欄を表示
        </label>

        <label>
            <input type="checkbox" id="showMusic">
            音楽プレーヤーを表示
        </label>
        </div>

        <div class="card">
        <h2>===🔗ショートカット===</h2>
        <label>
            <input type="checkbox" id="showShortcuts">
            ショートカットを表示
        </label>

        <div id="shortcut-list"></div>

        <button id="addShortcut">
            ＋追加
        </button>

        <button id="saveShortcuts">
            保存
        </button>

        <p>
            ※URLは https:// または http:// から入力してください<br>
            全部空欄にするとデフォルトが表示されます
        </p>
        </div>


        <div class="card">
        <h2>===🎨テーマ===</h2>

        <h3>カラー</h3>

        <input type="color" id="widgetColor">

        <label>透明度
        <input
            type="range"
            id="widgetOpacity"
            min="0"
            max="100"
            value="40">
        </label>

        <h3>フォント</h3>

        <select id="font">
            <option value="yomogi">Yomogi</option>
            <option value="keifont">けいふぉんと</option>
            <option value="mushin">無心</option>
            <option value="sans-serif">Sans Serif</option>
            <option value="serif">Serif</option>
            <option value="monospace">Monospace</option>
        </select>
        </div>

        <div class="card">
        <h2>===おまけ===</h2>

        <label>
            <input type="checkbox" id="showGreeting">
            あいさつを表示
        </label>

        <label>
            <input type="checkbox" id="showTip">
            豆知識・名言を表示
        </label>
        </div>

        <div class="card">
        <h2>===💾セーブ(バックアップ)===</h2>

        <button id="exportSettings">設定をエクスポート</button>

        <input 
            type="file" 
            id="settingsFile" 
            accept=".json" 
            hidden
        >

        <button id="importSettings">設定をインポート</button>
        </div>

        <div class="Red_card">
        <h2>===🚧危険===</h2>

        <button id="clearAll">
            初期化
        </button>

        <button id="clearSearchHistory">
            検索履歴を削除
        </button>
        
        <button id="resetBG">
            背景をデフォルトに戻す
        </button>

        <p style="color: red;">
            (↑設定がすべて初期化されます)
        </p>
        </div>

    </main>
    <footer>
        デフォ背景:<a href="https://photock.jp/">フォトック</a>様
    </footer>
</body>
</html>

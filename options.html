<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>ちょすTab</title>
        <link rel="stylesheet" href="/css/option.css">
        <script src="/js/options.js" defer></script>
    </head>
    <body>
    <header>
        <h1>ちょすTab - おぷしょん</h1>
    </header>
    <main>
        
        <h2>===🕑時計/📅日付===</h2>
        <label>
            <input type="checkbox" id="showClock">
            時計を表示
        </label>

        <label>
            <input type="checkbox" id="showSeconds">
            秒を表示
        </label>

        <label>
            <input type="checkbox" id="showDate">
            日付を表示
        </label>

        <h2>===🖼️背景===</h2>
        <h3>背景を変更</h3>
            <input type="file" id="backgroundFile" accept="image/*">

        <h2>===🔗ショートカット===</h2>
        <label>
            <input type="checkbox" id="showShortcuts">
            ショートカットを表示
        </label>

        <div id="shortcut-list"></div>

        <button id="addShortcut">
            ＋追加
        </button>

        <button id="saveShortcuts">
            保存
        </button>

        <p>
            ※URLは https:// または http:// から入力してください
        </p>

        <h2>===🎨テーマ===</h2>

        <h3>カラー</h3>

        <input type="color" id="widgetColor">

        <label>透明度</label>
        <input
            type="range"
            id="widgetOpacity"
            min="0"
            max="100"
            value="40">

        <h3>フォント</h3>

        <select id="font">
            <option value="yomogi">Yomogi</option>
            <option value="keifont">けいふぉんと</option>
            <option value="mushin">無心</option>
            <option value="sans-serif">Sans Serif</option>
            <option value="serif">Serif</option>
            <option value="monospace">Monospace</option>
        </select>
        
        <h2>===🚧危険===</h2>

        <button id="clearShortcuts">
            初期化
        </button>

        <p style="color: red;">
            (設定がすべて初期化されます)
        </p>

    </main>
    <footer>
        デフォ背景:<a href="https://booth.pm/ja/items/3000729">兎々とぅるる さん</a>
    </footer>
</body>
</html>

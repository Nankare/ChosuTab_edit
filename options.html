<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>ちょすTab</title>
        <link rel="stylesheet" href="/css/option.css">
        <script src="/js/options.js" defer></script>
    </head>
    <body>
    <header>
        <h1>ちょすTab - おぷしょん</h1>
    </header>
    <main>
        
        <h2>===🕑時計===</h2>
        <label>
            <input type="checkbox" id="showClock">
            時計を表示
        </label>

        <label>
            <input type="checkbox" id="showSeconds">
            秒を表示
        </label>

        <h2>===🖼️背景===</h2>
        <h3>背景を変更</h3>
            <input type="file" id="backgroundFile" accept="image/*">

        <h2>===🔗ショートカット===</h2>
        <label>
            <input type="checkbox" id="showShortcuts">
            ショートカットを表示
        </label>

        <div id="shortcut-list"></div>

        <button id="addShortcut">
            ＋追加
        </button>

        <button id="saveShortcuts">
            保存
        </button>

        <button id="clearShortcuts">
            初期化
        </button>

        <p>
            ※URLは https:// または http:// から入力してください
        </p>
        

    </main>
    <footer>
        デフォ背景:<a href="https://booth.pm/ja/items/3000729">兎々とぅるる さん</a>
    </footer>
</body>
</html>

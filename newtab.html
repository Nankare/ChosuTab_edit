<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ちょすたぶ</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="icon" href="/Favicon.ico" type="image/x-icon">
    <script src="/js/newtab.js" defer></script>
    <script src="/js/search.js" defer></script>
    <script src="/js/clock.js" defer></script>
    <script src="/js/shortcuts.js" defer></script>
    <script src="/js/date.js" defer></script>
    <script src="/js/greeting.js" defer></script>
    <script src="/js/tip.js" defer></script>
    <script src="/js/music.js" defer></script>
</head>
<body>

    <div id="background"></div>

    <header>
        <!--header&検索バー-->
        <form id="searchForm" >
        <input
            class="widget"
            type="text"
            id="searchInput"
            placeholder="Search..."
            autocomplete="off"
        >
        </form>
    </header>
    
    <main>
    <!--サジェスト-->
        <div id="suggestions"></div>

    <!--メモ-->
        <textarea id="memo" placeholder="メモ..."></textarea>

    <!--あいさつ-->
        <div class="widget" id="greeting"></div>

    <!--豆知識-->
        <div class="widget" id="tip"></div>

    <!--ショトカ-->
        <div id="shortcuts"></div>

    <!--音楽-->
        <div id="music">
            <div id="musicTitle">曲が選択されていません</div>
            <audio id="player" controls></audio>   
            <label class="musicVolume">
                音量
                <input id="musicVolume" type="range" min="0" max="100" value="100">
            </label>
            <input type="file" id="musicFile" accept="audio/*" hidden>

            <button id="selectMusic">
                🎵 音楽を選択
            </button>
        </div>

    <!--日付-->
            <div class="widget" id="date" ></div>
    <!--時計-->
        <div class="widget clock-widget">
            <div id="clock">00:00:00</div>
        </div>
    </main>

</body>
</html>
